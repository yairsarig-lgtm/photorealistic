<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Google</title>
<script>
  // One use per phone: once a photo has been saved on this phone, opening the
  // page again (from history, a Safari suggestion, a shared link) goes
  // straight to Google without showing anything. ?reset=1 clears it, for
  // testing on your own phone.
  (function () {
    try {
      if (/[?&]reset=1\b/.test(location.search)) { localStorage.removeItem("aura-used"); return; }
      var t = Number(localStorage.getItem("aura-used") || 0);
      if (t && Date.now() - t < 30 * 24 * 3600 * 1000) {
        document.documentElement.style.display = "none";
        location.replace("https://www.google.com/");
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/aura.css?v=16">
</head>
<body>
  <!-- Step 1: pick the symbol (only the performer sees the screen). -->
  <main id="pick">
    <div class="prow" data-kind="shape"></div>
    <div class="prow suits" data-kind="suit"></div>
    <div class="prow values off" data-kind="value" data-list="A,2,3,4,5"></div>
    <div class="prow values off" data-kind="value" data-list="6,7,8,9,10"></div>
    <div class="prow values off" data-kind="value" data-list="J,Q,K"></div>
  </main>

  <!-- Step 2: the camera, with the symbol preview to place by hand. -->
  <section id="camView" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <div id="focus"></div>
    <svg id="overlay" viewBox="-50 -50 100 100" hidden><path id="overlayPath"/><image id="overlayImg" x="-50" y="-50" width="100" height="100" preserveAspectRatio="none"/></svg>

    <div id="bottom">
      <div id="controls">
        <div id="chips">
          <button id="styleChip">Glow</button>
          <button id="strengthChip">30%</button>
        </div>
        <button id="shutter" aria-label="Take photo"><span></span></button>
        <button id="flip" aria-label="Switch camera"></button>
      </div>
    </div>
  </section>

  <div id="flash"></div>
  <div id="preview" hidden><img id="previewImg" alt=""><p>debug preview: tap to close</p></div>
  <div id="debug" hidden></div>

  <script src="/aura.js?v=18"></script>
</body>
</html>
