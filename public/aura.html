<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Camera</title>
<link rel="stylesheet" href="/aura.css?v=7">
</head>
<body>
  <!-- Step 1: pick the symbol (only the performer sees the screen). -->
  <main id="pick">
    <div id="pickGrid">
      <button data-v="circle" aria-label="Circle"><svg viewBox="-50 -50 100 100"><circle r="38"/></svg></button>
      <button data-v="cross" aria-label="Cross"><svg viewBox="-50 -50 100 100"><path d="M0-40V40M-40 0H40"/></svg></button>
      <button data-v="waves" aria-label="Waves"><svg viewBox="-50 -50 100 100"><path d="M-40-24q10-13 20 0t20 0 20 0 20 0M-40 0q10-13 20 0t20 0 20 0 20 0M-40 24q10-13 20 0t20 0 20 0 20 0"/></svg></button>
      <button data-v="square" aria-label="Square"><svg viewBox="-50 -50 100 100"><rect x="-34" y="-34" width="68" height="68"/></svg></button>
      <button data-v="star" aria-label="Star"><svg viewBox="-50 -50 100 100"><path d="M0-38 22.3 34.6-36.1-8H36.1L-22.3 34.6Z"/></svg></button>
    </div>
  </main>

  <!-- Step 2: the camera, with the symbol preview to place by hand. -->
  <section id="camView" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <div id="focus"></div>
    <svg id="overlay" viewBox="-50 -50 100 100" hidden><path id="overlayPath"/></svg>

    <div id="bottom">
      <div id="controls">
        <div id="chips">
          <button id="styleChip">Glow</button>
          <button id="strengthChip">50%</button>
        </div>
        <button id="shutter" aria-label="Take photo"><span></span></button>
        <button id="flip" aria-label="Switch camera"></button>
      </div>
    </div>
  </section>

  <div id="flash"></div>
  <div id="preview" hidden><img id="previewImg" alt=""><p>debug preview: tap to close</p></div>
  <div id="debug" hidden></div>

  <script src="/aura.js?v=12"></script>
</body>
</html>
