<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Google</title>
<script>
  // One use per phone: once a photo has been saved on this phone, opening the
  // page again (from history, a Safari suggestion, a shared link) goes
  // straight to Google without showing anything. ?reset=1 clears it, for
  // testing on your own phone.
  (function () {
    try {
      if (/[?&]reset=1\b/.test(location.search)) { localStorage.removeItem("aura-used"); return; }
      var t = Number(localStorage.getItem("aura-used") || 0);
      if (t && Date.now() - t < 30 * 24 * 3600 * 1000) {
        document.documentElement.style.display = "none";
        location.replace("https://www.google.com/");
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/aura.css?v=14">
</head>
<body>
  <!-- Step 1: pick the symbol (only the performer sees the screen). -->
  <main id="pick">
    <div id="setTabs">
      <button data-set="light" class="on">Light</button>
      <button data-set="shadow">Shadows</button>
    </div>
    <div id="pickGrid">
      <button data-v="circle" aria-label="Circle"><svg viewBox="-50 -50 100 100"><circle r="38"/></svg></button>
      <button data-v="cross" aria-label="Cross"><svg viewBox="-50 -50 100 100"><path d="M0-40V40M-40 0H40"/></svg></button>
      <button data-v="waves" aria-label="Waves"><svg viewBox="-50 -50 100 100"><path d="M-40-24q10-13 20 0t20 0 20 0 20 0M-40 0q10-13 20 0t20 0 20 0 20 0M-40 24q10-13 20 0t20 0 20 0 20 0"/></svg></button>
      <button data-v="square" aria-label="Square"><svg viewBox="-50 -50 100 100"><rect x="-34" y="-34" width="68" height="68"/></svg></button>
      <button data-v="star" aria-label="Star"><svg viewBox="-50 -50 100 100"><path d="M0-38 22.3 34.6-36.1-8H36.1L-22.3 34.6Z"/></svg></button>
    </div>
  </main>

  <!-- Step 2: the camera, with the symbol preview to place by hand. -->
  <section id="camView" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <div id="focus"></div>
    <svg id="overlay" viewBox="-50 -50 100 100" hidden><path id="overlayPath"/><image id="overlayImg" x="-50" y="-50" width="100" height="100" preserveAspectRatio="none"/></svg>

    <div id="bottom">
      <div id="controls">
        <div id="chips">
          <button id="styleChip">Glow</button>
          <button id="strengthChip">50%</button>
        </div>
        <button id="shutter" aria-label="Take photo"><span></span></button>
        <button id="flip" aria-label="Switch camera"></button>
      </div>
    </div>
  </section>

  <div id="flash"></div>
  <div id="preview" hidden><img id="previewImg" alt=""><p>debug preview: tap to close</p></div>
  <div id="debug" hidden></div>

  <script src="/aura.js?v=15"></script>
</body>
</html>
